[project]
name = "personal-scripts"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cn2an>=0.5.23",
    "lxml>=6.1.0",
    "opencc-python-reimplemented>=0.1.7",
    "pillow>=13.0.0",
    "pyobjc>=11.1",
    "pyobjc-framework-Vision>=11.1",
    "pyobjc-framework-Quartz>=11.1",
    "pytest>=8.0",
    "wordfreq>=3.0",
]

[project.scripts]
epub-to-zip = "epub_2_zip:main"
ebook-to-zip = "ebook_2_zip:main"
format-xhtml = "format_xhtml:main"

[tool.uv]
# 纯脚本仓库：源码全部平铺在 src/ 下作为模块（不是包），靠 pythonpath 与 sys.path[0] 互相导入
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[project]
name = "manga"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cn2an>=0.5.23",
    "lxml>=6.1.0",
    "pillow>=12.3.0",
    "pyobjc>=11.1",
    "pytest>=8.0",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

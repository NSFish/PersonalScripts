[project]
name = "manga"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "cn2an>=0.5.23",
    "lxml>=6.1.0",
    "pillow>=12.3.0",
    "pyobjc>=11.1",
    "pyobjc-framework-Vision>=11.1",
    "pyobjc-framework-Quartz>=11.1",
    "pytest>=8.0",
]

[tool.uv]
# 纯脚本仓库：源码全是平铺模块，不作为包安装；测试/脚本靠 pythonpath 和 sys.path[0] 导入
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

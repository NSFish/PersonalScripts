[project]
name = "epub"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "lxml>=6.1.0",
    "pillow>=12.3.0",
    "pyobjc-framework-Quartz>=11.1",
    "pyobjc-framework-Vision>=11.1",
    "pytest>=8.0",
]

[project.scripts]
epub-to-zip = "epub_2_zip:main"
ebook-to-zip = "ebook_2_zip:main"
format-xhtml = "format_xhtml:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages]
find = { where = ["src"] }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
